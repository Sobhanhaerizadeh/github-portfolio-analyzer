<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Portfolio Analyzer</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <header>
        <h1>GitHub Analyzer</h1>
        <p>Gib einen GitHub Namen ein und schau dir das Profil an.</p>
    </header>

    <div class="input-group w-50 mx-auto">
        <span class="input-group-text" id="addon-wrapping">@</span>
        <input type="text" class="form-control" aria-describedby="addon-wrapping" id="input" placeholder="GitHub Name">
        <button type="button" class="btn btn-primary" id="btn">Suchen</button>
    </div>

    <p class="error-msg" id="errorMsg"></p>


    <div id="loading" class="hidden">
        <p>Lädt...</p>
    </div>

    <div id="content" class="hidden container mt-4" style="max-width: 800px;">

        <!-- User Infos -->
        <div class="card p-3 mb-4">
            <div class="card-body">
                <img id="avatar" src="" alt="Avatar">
                <h2 id="name"></h2>
                <p id="login"></p>
                <p id="bio"></p>

                <div class="stats">
                    <span id="reposCount"></span> Repos
                    <span id="followers"></span> Follower
                    <span id="following"></span> Following
                </div>

                <a id="link" href="#" target="_blank">Profil öffnen</a>
            </div>
        </div>

        <!-- Chart -->
        <div class="card p-3 mb-4">
            <div class="card-body">
                <h3>Sprachen</h3>
                <canvas id="chart" class="w-50 d-block mx-auto"></canvas>
            </div>
        </div>


        <!-- Top Repositories -->
        <div class="card p-3">
            <div class="card-body">
                <h3>Top Repositories</h3>
                <div id="repos" class="row g-3"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="js/app.js"></script>
</body>

</html>
