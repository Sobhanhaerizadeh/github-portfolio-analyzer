<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Portfolio Analyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="wrapper">

    <!-- Header -->
    <header>
      <div class="eyebrow">Dev Tool</div>
      <h1>GitHub <em>Analyzer</em></h1>
      <p class="subtitle">Enter a GitHub username and explore their profile, languages and top repositories.</p>
    </header>

    <!-- Search -->
    <div class="search-box">
      <span class="search-at">@</span>
      <input type="text" id="input" placeholder="GitHub username" autocomplete="off" spellcheck="false">
      <button id="btn">
        Analyze
        <svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 7H12M12 7L8 3M12 7L8 11"/>
        </svg>
      </button>
    </div>

    <!-- Error -->
    <div class="error-msg" id="errorMsg"></div>

    <!-- Loading -->
    <div class="loading hidden" id="loading">
      <div class="loading-dots">
        <span></span><span></span><span></span>
      </div>
      <p>Fetching profile...</p>
    </div>

    <!-- Content -->
    <div id="content" class="hidden">

      <!-- Profile Card -->
      <div class="profile-card">
        <div class="profile-left">
          <img id="avatar" src="" alt="Avatar">
          <div class="profile-info">
            <h2 id="name"></h2>
            <p class="login" id="login"></p>
            <p class="bio" id="bio"></p>
          </div>
        </div>
        <div class="profile-stats">
          <div class="stat">
            <span class="stat-num" id="reposCount"></span>
            <span class="stat-lbl">Repos</span>
          </div>
          <div class="stat">
            <span class="stat-num" id="followers"></span>
            <span class="stat-lbl">Followers</span>
          </div>
          <div class="stat">
            <span class="stat-num" id="following"></span>
            <span class="stat-lbl">Following</span>
          </div>
        </div>
        <a id="profileLink" href="#" target="_blank" class="profile-link">
          View on GitHub
          <svg width="11" height="11" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 7H12M12 7L8 3M12 7L8 11"/>
          </svg>
        </a>
      </div>

      <!-- Divider -->
      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-label">LANGUAGES</span>
        <div class="divider-line"></div>
      </div>

      <!-- Chart -->
      <div class="chart-card">
        <canvas id="chart"></canvas>
        <div class="chart-legend" id="chartLegend"></div>
      </div>

      <!-- Divider -->
      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-label">TOP REPOSITORIES</span>
        <div class="divider-line"></div>
      </div>

      <!-- Repos Grid -->
      <div class="repos-grid" id="repos"></div>

    </div>

    <!-- Footer -->
    <footer>
      <div class="footer-left">
        <span class="footer-made">Coded by</span>
        <span class="footer-author">
          <a href="https://sobhanhaerizadeh.de" target="_blank">Sobhan Haerizadeh</a>
        </span>
      </div>
      <div class="footer-right">
        <span class="footer-heart">Made with <span class="heart-icon">♥</span></span>
        <div class="footer-dot"></div>
      </div>
    </footer>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
